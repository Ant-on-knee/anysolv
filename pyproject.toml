[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anysolv"
version = "0.1.0"
description = "Standalone implicit solvation model for machine-learning interatomic potentials"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anton Z. Ni" }]
keywords = [
    "chemistry",
    "solvation",
    "machine-learning-potential",
    "interatomic-potential",
]
dependencies = [
    "numpy",
    "torch",
]

[project.optional-dependencies]
samples = ["ase"]
ase = ["ase"]
# Downloading the gated checkpoint from Hugging Face.
hub = ["huggingface_hub"]
# GPU Triton kernels for the fast_gpu
gpu = ["triton>=3.4"]

[project.urls]
Repository = "https://github.com/Ant-on-knee/anysolv"
"Model weights" = "https://huggingface.co/antonknee/anysolv"

[tool.setuptools]
package-dir = { "anysolv" = "." }
packages = [
    "anysolv",
    "anysolv._backbone",
    "anysolv._backbone._compat",
    "anysolv._backbone.common",
    "anysolv._backbone.nn",
    "anysolv._backbone.triton",
]

[tool.setuptools.package-data]
# Include compact weights.
# model_moe.pt is intentionally excluded — it is downloaded separately.
"anysolv" = ["_const/*.json", "_const/*.pt", "models/model_compact.pt"]
"anysolv._backbone" = ["*.pt"]
